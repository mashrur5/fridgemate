[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fridgemate"
version = "0.2.0"
description = "Fridgemate: an AI agent for shared-fridge inventory, recipes and waste-rescue meal plans (EECS 3311)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "typer>=0.12"]

[project.scripts]
fridgemate = "cli.main:main"
fridgemate-server = "server.api.app:main"
fridgemate-agent = "cli.agent_cli:main"

[tool.setuptools.packages.find]
include = ["server*", "cli*"]

[tool.setuptools.package-data]
"server.infrastructure.persistence" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
